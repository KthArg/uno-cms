name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un PR que recibe varios push seguidos no debe dejar ejecuciones zombis consumiendo
# minutos ni, peor, reportando un verde de un commit ya superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: ningún job de este workflow escribe en el repositorio.
permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ── Cadena rápida: lint → typecheck → unit → build ────────────────────────────────
  # Encadenados a propósito y no en paralelo: los checks baratos deben cortar antes de
  # gastar minutos en los caros. Un error de formato no merece esperar a un build.

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: format:check
        run: pnpm format:check

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: unit
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: unit + cobertura
        # COVERAGE_ENFORCE se activará en M3, cuando cms/core y cms/security tengan
        # código. Ver vitest.config.ts y SPEC §11.4.
        run: pnpm test:coverage

  build:
    name: build
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `next build` es también el guard de la frontera servidor/cliente de SPEC §7.1:
      # `server-only` rompe la compilación en cuanto un módulo que lo importa se vuelve
      # alcanzable desde el grafo de cliente. Ver docs/specs/00-fundaciones.md §3.5.
      - run: pnpm build

  # ── En paralelo con la cadena rápida ──────────────────────────────────────────────

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unocms
          POSTGRES_PASSWORD: unocms
          POSTGRES_DB: unocms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unocms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://unocms:unocms@localhost:5432/unocms_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Si DATABASE_URL no llegara al job, los tests se saltarían y el job daría verde sin
      # haber probado nada. Este paso convierte ese silencio en un fallo.
      - name: confirmar que el servicio Postgres responde
        run: |
          until pg_isready -h localhost -p 5432 -U unocms; do sleep 1; done
          psql "$DATABASE_URL" -c 'select version();'
      - run: pnpm test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: caché de navegadores de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: instalar chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SPEC §7.1 "Dependencias" y §11.5: cero findings high/critical. Bloqueante desde el
      # primer día; no hay ruido que justifique lo contrario (los tres advisories high que
      # arrastraba `next` se cierran con overrides en package.json).
      - run: pnpm audit --audit-level=high

  # ── Agregador ─────────────────────────────────────────────────────────────────────
  # Este es el ÚNICO check que exige la protección de rama. Enumerar cada job en la
  # protección obligaría a tocar la configuración del repositorio cada vez que se añade
  # uno, y un job nuevo no exigido pasaría a ser opcional sin que nadie lo note.

  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, unit, build, integration, e2e, audit]
    runs-on: ubuntu-latest
    steps:
      - name: comprobar que ningún job requerido falló o se saltó
        # El resultado viaja por env y no interpolado en el propio script: una expresión
        # metida directamente en `run` se concatena al shell antes de ejecutarlo.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::Al menos un job requerido no terminó en success ($RESULTS)."
              exit 1
            fi
          done
