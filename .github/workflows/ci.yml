name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un PR que recibe varios push seguidos no debe dejar ejecuciones zombis consumiendo
# minutos ni, peor, reportando un verde de un commit ya superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: ningún job de este workflow escribe en el repositorio.
permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ── Cadena rápida: lint → typecheck → unit → build ────────────────────────────────
  # Encadenados a propósito y no en paralelo: los checks baratos deben cortar antes de
  # gastar minutos en los caros. Un error de formato no merece esperar a un build.

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # --ignore-scripts: este job no necesita binarios nativos, así que no hay razón
      # para ejecutar código de instalación de terceros en un runner con red.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - name: format:check
        run: pnpm format:check

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck

  unit:
    name: unit
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      # Los tests de componentes del panel van aquí y no en el job de integración: no
      # necesitan base de datos, así que su sitio es la cadena rápida, donde un fallo de
      # interfaz se ve sin esperar a que arranque Postgres.
      - run: pnpm test:ui

  build:
    name: build
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `next build` es también el guard de la frontera servidor/cliente de SPEC §7.1:
      # `server-only` rompe la compilación en cuanto un módulo que lo importa se vuelve
      # alcanzable desde el grafo de cliente. Ver docs/specs/00-fundaciones.md §3.5.
      - run: pnpm build

  # ── En paralelo con la cadena rápida ──────────────────────────────────────────────

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unocms
          POSTGRES_PASSWORD: unocms
          POSTGRES_DB: unocms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unocms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://unocms:unocms@localhost:5432/unocms_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Si DATABASE_URL no llegara al job, los tests se saltarían y el job daría verde sin
      # haber probado nada. Este paso convierte ese silencio en un fallo.
      - name: confirmar que el servicio Postgres responde
        run: |
          until pg_isready -h localhost -p 5432 -U unocms; do sleep 1; done
          psql "$DATABASE_URL" -c 'select version();'
      # Las migraciones las aplica el `globalSetup` de Vitest (T-41-1), no un paso de CI:
      # así el mismo comando funciona igual en local y aquí. Este paso extra existe solo
      # para que un fallo de migración se vea como tal y no enterrado en la salida de los
      # tests; es idempotente, la suite lo repite y no pasa nada.
      - name: aplicar migraciones
        run: pnpm db:migrate
      # **La cobertura se mide aquí y no en el job `unit`**, y esto merece explicación.
      #
      # SPEC §11.4 exige ≥ 80 % en `cms/core` y `cms/security`. Midiéndola solo sobre los
      # tests unitarios daba 73 %, y no porque falten pruebas: la lectura de contenido, el
      # envoltorio de actions y buena parte de `cms/security` se ejercitan **contra Postgres
      # real**, que es donde tienen sentido. Un umbral que ignora la mitad de la suite mide
      # cómo están repartidos los tests, no cuánto código está cubierto — y la forma cómoda de
      # cumplirlo sería mover tests a unitarios con dobles, que es peor prueba.
      #
      # Así que corre sobre las dos suites, en el job que tiene base de datos. El precio es
      # que los unitarios se ejecutan dos veces en CI; son cuarenta segundos y el job `unit`
      # sigue existiendo aparte para que un fallo unitario se vea sin esperar a Postgres.
      - name: integración + cobertura (SPEC §11.4)
        env:
          COVERAGE_ENFORCE: '1'
        run: pnpm test:coverage

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Un cuelgue debe fallar rápido, no quemar media hora de runner y dejar el PR
    # bloqueado sin que nadie sepa por qué. El e2e completo tarda menos de dos minutos.
    timeout-minutes: 10
    # El e2e comprueba el guard de /admin y las cabeceras de SPEC §7.2, así que necesita
    # secretos de sesión y una base de datos: el layout del panel consulta el claim `pwdV`
    # (ADR-301) y /api/health hace ping a Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unocms
          POSTGRES_PASSWORD: unocms
          POSTGRES_DB: unocms_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unocms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://unocms:unocms@localhost:5432/unocms_e2e
      # Secretos de usar y tirar, solo para esta ejecución. No son secretos reales y no
      # tienen por qué estar en los ajustes del repositorio.
      AUTH_SECRET: e2e-solo-para-ci-con-mas-de-treinta-y-dos-caracteres
      APP_SECRET: e2e-otro-distinto-tambien-de-mas-de-treinta-y-dos
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # La versión se lee de package.json en vez de repetirse aquí: dos fuentes de verdad
      # acabarían divergiendo y la caché serviría navegadores de otra versión.
      - name: leer la versión de Playwright
        id: playwright-version
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: aplicar migraciones
        run: pnpm db:migrate
      - name: caché de navegadores de Playwright
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # La clave cuelga de la versión de Playwright, no del lockfile: el lockfile
          # cambiará en casi todos los PR de M1 a M5 y la caché no acertaría nunca.
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # **Sin `--with-deps`**, y esto tiene historia.
      #
      # La versión original separaba el caso "caché acertada" para ejecutar solo
      # `install-deps`. Ese camino nunca se había ejecutado —el PR #23 dejó anotado que la
      # caché no tenía acierto verificado— y la primera vez que acertó, **se colgó media
      # hora**. Al quitar el condicional y dejar `install --with-deps`, se colgó igual.
      #
      # Lo que cuelga es el `apt-get` de `--with-deps`, no la caché. Y en los runners de
      # GitHub esas librerías ya vienen en la imagen, así que el paso no aporta nada y sí
      # depende de que el gestor de paquetes del runner esté libre.
      - name: instalar chromium
        run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # SPEC §7.1 "Dependencias" y §11.5: cero findings high/critical. Bloqueante desde el
      # primer día; no hay ruido que justifique lo contrario (los tres advisories high que
      # arrastraba `next` se cierran con overrides en package.json).
      - run: pnpm audit --audit-level=high

  # ── Agregador ─────────────────────────────────────────────────────────────────────
  # Este es el ÚNICO check que exige la protección de rama. Enumerar cada job en la
  # protección obligaría a tocar la configuración del repositorio cada vez que se añade
  # uno, y un job nuevo no exigido pasaría a ser opcional sin que nadie lo note.

  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, unit, build, integration, e2e, audit]
    runs-on: ubuntu-latest
    steps:
      - name: comprobar que ningún job requerido falló o se saltó
        # El resultado viaja por env y no interpolado en el propio script: una expresión
        # metida directamente en `run` se concatena al shell antes de ejecutarlo.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::Al menos un job requerido no terminó en success ($RESULTS)."
              exit 1
            fi
          done
